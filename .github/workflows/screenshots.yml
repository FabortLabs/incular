name: Screenshots

# Runs every example on Linux, in the browser, on an Android emulator and on
# an iOS simulator, and uploads a screenshot and log of each as one artifact
# per platform. An example fails when it crashes, panics or draws nothing.

on:
  push:
    branches: [master, 'feat/mobile']
  pull_request:
  workflow_dispatch:
    inputs:
      examples:
        description: Comma-separated examples (empty for all)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EXAMPLES: ${{ inputs.examples }}

jobs:
  linux:
    name: Linux desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native dependencies, Xvfb and software Vulkan
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libudev-dev libdbus-1-dev xvfb imagemagick mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-screenshots
      - name: Run examples and take screenshots
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          python3 scripts/screenshots.py linux --release ${EXAMPLES:+--examples "$EXAMPLES"}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-screenshots
          path: target/incular/screenshots/linux
          if-no-files-found: warn

  web:
    name: Browser (WebGPU and WebGL2)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: web-screenshots
      - name: Install wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          wasm-bindgen --version 2>/dev/null | grep -q "$version" || cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Run examples and take screenshots
        run: python3 scripts/web-smoke.py --software --out target/incular/screenshots/web ${EXAMPLES:+--examples "$EXAMPLES"}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshots
          path: target/incular/screenshots/web/**/*.png
          if-no-files-found: warn

  android:
    name: Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Install Rust target
        run: rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-x86_64
      - name: Build APKs
        # Failures repeat in the run step, which reports every example.
        continue-on-error: true
        run: python3 scripts/screenshots.py android --build-only --release --abi x86_64 ${EXAMPLES:+--examples "$EXAMPLES"}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache emulator snapshot
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64
      - name: Create emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."
      - name: Run examples and take screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/screenshots.py android --release --abi x86_64 ${EXAMPLES:+--examples "$EXAMPLES"}
      - name: Report results
        # The emulator action swallows workflow commands; replay them here.
        if: always()
        run: cat target/incular/screenshots/android/annotations.txt || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screenshots
          path: target/incular/screenshots/android
          if-no-files-found: warn

  ios:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust target
        run: rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios-sim
      - name: Build app bundles
        # Failures repeat in the run step, which reports every example.
        continue-on-error: true
        run: python3 scripts/screenshots.py ios --build-only --release ${EXAMPLES:+--examples "$EXAMPLES"}
      - name: Boot simulator
        run: |
          device=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          echo "Booting $device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Run examples and take screenshots
        run: python3 scripts/screenshots.py ios --release ${EXAMPLES:+--examples "$EXAMPLES"}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: target/incular/screenshots/ios
          if-no-files-found: warn
