[package]
name = "incular-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "iOS platform integration for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-ios"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-accessibility = { workspace = true }
incular-mobile = { workspace = true }
incular-runtime = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
incular-config = { workspace = true }
incular-core = { workspace = true }
incular-platform = { workspace = true }
incular-wgpu = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSEnumerator", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSSet", "NSString", "NSThread"] }
objc2-quartz-core = { workspace = true, features = ["CADisplayLink", "CALayer", "CAMetalLayer"] }
objc2-ui-kit = { workspace = true, features = ["UIApplication", "UIEvent", "UIGeometry", "UIResponder", "UIScene", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UITouch", "UIView", "UIViewController", "UIWindow", "UIWindowScene"] }
raw-window-handle = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-ios"
targets = []
