[package]
name = "incular-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Browser (wasm32) entry for Incular over the shared Winit host"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-web"
keywords = ["gui", "ui", "incular", "wasm", "web"]
categories = ["gui", "wasm"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "fonts/**", "README.md", "LICENSE"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-core = { workspace = true }
incular-desktop = { workspace = true }
incular-runtime = { workspace = true }
incular-text = { workspace = true }
incular-widgets = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
incular-accessibility = { workspace = true }
incular-platform = { workspace = true }
winit = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
serde_json = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ClipboardEvent",
    "CompositionEvent",
    "console",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FocusEvent",
    "FocusOptions",
    "History",
    "HtmlCanvasElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlTextAreaElement",
    "ImageBitmap",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Node",
    "NodeList",
    "Response",
    "VisibilityState",
    "Window",
] }

[features]
# Embeds Inter Regular and Bold (SIL OFL 1.1, about 830 KB) and registers them
# at launch, because browsers expose no system fonts to the text engine.
# Disable it to ship only the fonts the application registers itself.
default = ["default-font"]
default-font = []

[package.metadata.docs.rs]
all-features = true
default-target = "wasm32-unknown-unknown"
targets = []
