[package]
name = "incular-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Asset handles and resource loading foundations for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-assets"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }
futures-core = { workspace = true }
incular-core = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
