[package]
name = "incular-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Android platform integration for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-android"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "android/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Initializes rustls-platform-verifier with the app context at startup, so
# HTTPS clients that verify through it (reqwest's default `rustls` backend)
# work without app code. `incular build android` adds its Kotlin component.
platform-verifier = ["dep:jni", "dep:rustls-platform-verifier"]

[dependencies]
incular-accessibility = { workspace = true }
incular-mobile = { workspace = true }
incular-runtime = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
incular-config = { workspace = true }
incular-core = { workspace = true }
incular-platform = { workspace = true }
incular-wgpu = { workspace = true }
jni = { workspace = true, optional = true }
jni-sys = { workspace = true }
libc = { workspace = true }
ndk = { workspace = true }
ndk-context = { workspace = true }
ndk-sys = { workspace = true }
raw-window-handle = { workspace = true }
rustls-platform-verifier = { workspace = true, optional = true }
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-linux-android"
targets = []
